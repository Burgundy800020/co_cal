dataset: mujoco/hopper/medium-v0
seed: 0
device: cpu
normalize_state: true
train:
  steps: 80_000
  batch_size: 256
  eval_every: 20_000
  eval_episodes: 20
  save_every: 80_000
algo:
  alpha: 2.5
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  hidden: [256, 256]
